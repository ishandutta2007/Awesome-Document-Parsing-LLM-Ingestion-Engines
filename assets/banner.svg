<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0d1127" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
    </pattern>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.6; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPillLag {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes dataFlow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 150px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: 1000px 250px; }
    .pill-group-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-group-2 { animation: floatPillLag 6s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 8 6; animation: dataFlow 15s linear infinite; }
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
  </style>

  <!-- Background Base & Grid -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g>
    <circle class="orb-1" cx="180" cy="140" r="180" fill="#38bdf8" filter="url(#glow)" />
    <circle class="orb-2" cx="1020" cy="280" r="220" fill="#8b5cf6" filter="url(#glow)" />
    <circle cx="600" cy="380" r="140" fill="#ec4899" opacity="0.15" filter="url(#glow)" />
  </g>

  <!-- Flow / Pipeline Background Connectors -->
  <g opacity="0.35">
    <path class="flow-line" d="M 80 80 Q 300 20 600 80 T 1120 80" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-line" d="M 80 340 Q 400 400 700 340 T 1120 340" fill="none" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Animated Interactive Pills (Subtle Background Decor that frames content) -->
  <g class="pill-group-1" opacity="0.9">
    <!-- Top Left Pill -->
    <rect x="80" y="45" width="145" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <text x="152" y="66" fill="#7dd3fc" font-size="12" class="font-title" text-anchor="middle">⚡ RAG Ingestion</text>

    <!-- Bottom Left Pill -->
    <rect x="110" y="345" width="165" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
    <text x="192" y="366" fill="#c7d2fe" font-size="12" class="font-title" text-anchor="middle">🧩 Semantic Chunking</text>
  </g>

  <g class="pill-group-2" opacity="0.9">
    <!-- Top Right Pill -->
    <rect x="960" y="45" width="160" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
    <text x="1040" y="66" fill="#f0abfc" font-size="12" class="font-title" text-anchor="middle">📑 Multimodal OCR</text>

    <!-- Bottom Right Pill -->
    <rect x="930" y="345" width="180" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1.2" />
    <text x="1020" y="366" fill="#6ee7b7" font-size="12" class="font-title" text-anchor="middle">🚀 Markdown Pipelines</text>
  </g>

  <!-- Foreground Title and Content (Ensured Clear and Unobscured) -->
  <g id="foreground-content">
    <!-- Category Badge -->
    <rect x="445" y="60" width="310" height="30" rx="15" fill="#1e1e38" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="463" cy="75" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="605" y="80" fill="#a5b4fc" font-size="13" class="font-title" text-anchor="middle" letter-spacing="1.5">CURATED ECOSYSTEM GUIDE</text>

    <!-- Main Title -->
    <text x="600" y="160" class="font-title" font-size="44" text-anchor="middle" fill="url(#textGrad)" letter-spacing="-0.5">
      Document Parsing &amp; LLM Ingestion
    </text>

    <!-- Subtitle -->
    <text x="600" y="210" class="font-sub" font-size="20" text-anchor="middle" fill="#94a3b8" letter-spacing="0.2">
      The definitive index of SaaS engines &amp; open-source architectures for GenAI
    </text>

    <!-- Highlighted Feature Badges / Bar -->
    <g transform="translate(230, 250)">
      <!-- Box 1 -->
      <rect x="0" y="0" width="160" height="48" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="80" y="24" fill="#38bdf8" font-size="14" class="font-title" text-anchor="middle">PDF &amp; Office</text>
      <text x="80" y="40" fill="#64748b" font-size="11" class="font-sub" text-anchor="middle">Layout &amp; Structure</text>

      <!-- Box 2 -->
      <rect x="190" y="0" width="160" height="48" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="270" y="24" fill="#818cf8" font-size="14" class="font-title" text-anchor="middle">Vision-Language</text>
      <text x="270" y="40" fill="#64748b" font-size="11" class="font-sub" text-anchor="middle">OCR &amp; VLM Extractors</text>

      <!-- Box 3 -->
      <rect x="380" y="0" width="160" height="48" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="460" y="24" fill="#c084fc" font-size="14" class="font-title" text-anchor="middle">Clean Markdown</text>
      <text x="460" y="40" fill="#64748b" font-size="11" class="font-sub" text-anchor="middle">LLM &amp; Vector Ready</text>

      <!-- Box 4 -->
      <rect x="570" y="0" width="160" height="48" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="650" y="24" fill="#34d399" font-size="14" class="font-title" text-anchor="middle">Enterprise IDP</text>
      <text x="650" y="40" fill="#64748b" font-size="11" class="font-sub" text-anchor="middle">High Accuracy &amp; Scale</text>
    </g>
  </g>
</svg>
